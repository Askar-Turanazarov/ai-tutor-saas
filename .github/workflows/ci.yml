name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Placeholder values only: CI never calls Stripe, Click, AI providers or SMTP.
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret
      APP_URL: http://localhost:3000
      BILLING_TIMER: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/pg-schema.mjs --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx prisma db push --skip-generate
      - run: npm run build
